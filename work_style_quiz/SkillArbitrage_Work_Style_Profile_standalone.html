<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SkillArbitrage Work Style Profile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Mulish:wght@400;500;600;700&display=swap">
<style>
/* Layout: brand header bar, then one 780px reading column; navy hero bands carry the logo's pill-and-dot motif; admin widens to 1180px */
:root{
  --bg:#f8f8ff; --surface:#ffffff; --fg:#171717; --muted:#667085; --line:#e3e6ee; --line-strong:#d9dce3;
  --brand:#2941ba; --brand-ink:#ffffff; --brand-soft:#eef0ff; --lilac:#93a5ff; --navy:#14162b; --navy-fg:#ffffff; --navy-muted:#b9c0e6;
  --warn:#9a5b00; --warn-soft:#fff3dc; --ok:#1d7a4c; --ok-soft:#e1f5ea; --danger:#c0392b;
  --ei:#2941ba; --sn:#d97a2b; --tf:#178f80; --jp:#7a52d8;
  --display:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"Mulish","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,22,43,.05),0 8px 24px -12px rgba(20,22,43,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e1f; --surface:#151834; --fg:#eceeff; --muted:#9ba3c7; --line:#252a4d; --line-strong:#323863;
  --brand:#93a5ff; --brand-ink:#0c0e1f; --brand-soft:#1e2350; --lilac:#93a5ff; --navy:#1a1e42; --navy-fg:#ffffff; --navy-muted:#b9c0e6;
  --warn:#f2b85a; --warn-soft:#3a2b10; --ok:#6fd3a0; --ok-soft:#123324; --danger:#ff8a7a;
  --ei:#93a5ff; --sn:#f0a464; --tf:#5cd1bf; --jp:#b59bff; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e1f; --surface:#151834; --fg:#eceeff; --muted:#9ba3c7; --line:#252a4d; --line-strong:#323863;
  --brand:#93a5ff; --brand-ink:#0c0e1f; --brand-soft:#1e2350; --lilac:#93a5ff; --navy:#1a1e42; --navy-fg:#ffffff; --navy-muted:#b9c0e6;
  --warn:#f2b85a; --warn-soft:#3a2b10; --ok:#6fd3a0; --ok-soft:#123324; --danger:#ff8a7a;
  --ei:#93a5ff; --sn:#f0a464; --tf:#5cd1bf; --jp:#b59bff; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .in{max-width:1180px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--fg)}
.brand svg{height:24px;width:auto;flex:none}
.brand .a{color:var(--fg)}
.pill-tag{font:600 12px var(--display);letter-spacing:.04em;padding:5px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.wrap{max-width:780px;margin:0 auto;padding-block:32px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1180px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,5.4vw,46px);font-weight:800}
h2{font-size:clamp(22px,3.4vw,28px);font-weight:700}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
/* navy hero band with logo motif */
.hero{position:relative;overflow:hidden;background:var(--navy);color:var(--navy-fg);border-radius:20px;padding:36px 28px}
.hero .eyebrow{color:var(--navy-muted)}
.hero p{color:var(--navy-muted)}
.hero > *{position:relative;z-index:1}
.motif{position:absolute;right:-70px;top:-30px;z-index:0;opacity:.75;pointer-events:none}
[hidden]{display:none!important}
.motif i{position:absolute;background:var(--lilac);opacity:.16}
.motif .p{width:110px;height:270px;border-radius:55px;right:150px;top:10px}
.motif .d{width:110px;height:110px;border-radius:50%;right:20px;top:90px}
@media (max-width:560px){.motif{opacity:.5}.hero{padding:28px 20px}}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--brand-soft);margin-bottom:24px}
.tabs button{background:none;border:0;border-radius:9px;padding:8px 16px;font:600 14px var(--display);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.btn{font:600 15px var(--display);border-radius:10px;padding:12px 22px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px -8px var(--brand)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
label{font:600 13px var(--display);color:var(--fg)}
input,select{font:16px var(--body);padding:11px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--fg);width:100%}
input:focus,select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 220px;min-width:0}
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.plain li{display:flex;gap:12px}
ul.plain li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--lilac);margin-top:9px}
.note{font-size:14px;color:var(--muted)}
.err{color:var(--danger);font-size:14px}
/* quiz */
.progress{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:12px;z-index:5}
.bar{height:6px;background:var(--brand-soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .35s}
.q{display:flex;flex-direction:column;gap:14px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.q.answered{border-color:var(--line-strong)}
.qnum{font:600 12px var(--display);color:var(--brand);letter-spacing:.08em}
.scenario{font-size:17px;font-weight:600;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;font-size:15px;transition:background .15s,border-color .15s}
.opt b{font-family:var(--display);color:var(--brand);flex:none}
.opt.lean{border-color:var(--brand);background:var(--brand-soft)}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.scale button{font:600 13px var(--display);padding:9px 4px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.scale button:hover{color:var(--fg)}
.scale button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
@media (max-width:560px){.opts{grid-template-columns:1fr}.scale{grid-template-columns:repeat(2,1fr)}}
/* result */
.reveal{display:flex;gap:4px}
.reveal span{font-family:var(--display);font-size:clamp(60px,14vw,96px);font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--navy-fg);animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both}
.reveal span:nth-child(odd){color:var(--lilac)}
.reveal span:nth-child(2){animation-delay:.2s}.reveal span:nth-child(3){animation-delay:.4s}.reveal span:nth-child(4){animation-delay:.6s}
@keyframes pop{from{transform:translateY(18px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.typename{font-family:var(--display);font-size:clamp(22px,3.6vw,30px);font-weight:700;color:var(--navy-fg)}
.meter{display:flex;flex-direction:column;gap:8px}
.meter .ends{display:flex;justify-content:space-between;font:500 14px var(--display);color:var(--muted)}
.meter .ends .on{color:var(--fg);font-weight:700}
.track{position:relative;height:10px;border-radius:5px;background:var(--brand-soft)}
.track .dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);border:4px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.track .fill{position:absolute;top:0;bottom:0;border-radius:5px;opacity:.5}
.meter .pct{font:700 14px var(--display)}
.fun{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.fun{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.fun{grid-template-columns:1fr}}
.funcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.funcard .k{font:600 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.funcard .v{font-size:15px;line-height:1.5}
.lock{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);padding:14px 18px;border:1px dashed var(--line-strong);border-radius:12px}
/* admin */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tbody tr:hover{background:var(--bg)}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;font:700 13px var(--display);padding:3px 9px;border-radius:7px;background:var(--brand-soft);color:var(--brand);letter-spacing:.04em}
.flag{display:inline-block;font:600 12px var(--display);padding:3px 10px;border-radius:999px}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.why{font-size:12px;color:var(--muted);white-space:normal;max-width:240px;margin-top:6px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.split{display:flex;height:26px;border-radius:7px;overflow:hidden;font:600 12px var(--display);color:var(--surface);gap:2px}
.split span{display:flex;align-items:center;justify-content:center;min-width:0}
.kpis{display:flex;gap:28px;flex-wrap:wrap}
.kpi b{display:block;font:800 30px var(--display);color:var(--navy-fg);line-height:1}
.kpi span{font-size:13px;color:var(--navy-muted)}
.empty{padding:36px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>
/* one-question-at-a-time player, milestones, graphics */
.player{display:flex;flex-direction:column;gap:18px}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{height:8px;border-radius:4px;background:var(--brand-soft);overflow:hidden}
.seg i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .35s}
.counter{font:700 14px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.counter b{color:var(--fg);font-size:18px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:20px;overflow:hidden}
.card.in{animation:slidein .35s cubic-bezier(.2,.8,.2,1) both}
.card.back{animation:slideback .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideback{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.illo{width:88px;height:88px;position:relative;flex:none}
.illo .pp{position:absolute;left:0;top:4px;width:34px;height:80px;border-radius:17px;background:var(--lilac);opacity:.35}
.illo .dd{position:absolute;left:18px;top:14px;width:64px;height:64px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;border:2px solid var(--surface)}
.illo svg{width:34px;height:34px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qhead{display:flex;gap:18px;align-items:center}
.qhead .scenario{font:600 clamp(17px,2.4vw,20px)/1.45 var(--display);letter-spacing:-.01em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.choices{grid-template-columns:1fr}.qhead{flex-direction:column;align-items:flex-start}.card{padding:22px}}
.choice{border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,background .15s,transform .15s}
.choice:hover{border-color:var(--lilac)}
.choice.sel{border-color:var(--brand);background:var(--brand-soft)}
.choice .txt{font-size:16px;line-height:1.5;flex:1}
.choice .tag{font:700 12px var(--display);color:var(--brand);letter-spacing:.1em}
.str{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.str button{font:600 13px var(--display);padding:10px 6px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);cursor:pointer;transition:background .15s,color .15s,transform .1s}
.str button:hover{border-color:var(--brand);color:var(--brand)}
.str button:active{transform:scale(.97)}
.str button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pnav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kbd{font-size:13px;color:var(--muted)}
.kbd kbd{font:600 12px var(--display);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}
@media (max-width:600px){.kbd{display:none}}
.milestone{text-align:center;align-items:center;padding-block:40px}
.milestone .big{font:800 clamp(40px,8vw,64px)/1 var(--display);color:var(--brand)}
.dims4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.dims4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dimc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.dimc .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.dimc .ic svg{width:24px;height:24px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dimc .t{font:600 14px var(--display);line-height:1.3}
.dimc .s{font-size:13px;color:var(--muted)}
.steps{display:flex;gap:16px;flex-wrap:wrap}
.steps div{display:flex;gap:10px;align-items:center;font-size:15px}
.steps b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font:700 13px var(--display);flex:none}
.funcard .ic{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;margin-bottom:4px}
.funcard .ic svg{width:20px;height:20px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.typegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tg{border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;position:relative;min-height:84px}
.tg .c{font:800 17px var(--display);letter-spacing:.03em}
.tg .n{font-size:12px;color:var(--muted)}
.tg .k{position:absolute;right:10px;top:10px;font:800 20px var(--display);color:var(--brand)}
.tg.has{border-color:var(--brand)}
.tg.zero{opacity:.55}
@media (max-width:600px){.typegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qtable td{white-space:normal;min-width:160px;line-height:1.45}
.qtable td:first-child{min-width:40px}
.mtag{display:inline-block;font:700 11px var(--display);padding:2px 8px;border-radius:6px;color:var(--surface)}
.lk{padding:18px 4px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .2s}
.lk:first-of-type{border-top:0}
.lk.done{opacity:.45}.lk.done:hover,.lk.active{opacity:1}
.lk-q{font:600 clamp(16px,2.2vw,19px)/1.45 var(--display);text-align:center;max-width:46ch;letter-spacing:-.01em}
.lk-scale{display:flex;align-items:center;gap:clamp(6px,1.6vw,14px)}
.lk-end{font:600 13px var(--display);width:64px}
.lk-end.ag{color:var(--brand);text-align:right}.lk-end.dg{color:var(--sn)}
.dot{border-radius:50%;background:transparent;cursor:pointer;padding:0;border:2px solid;transition:background .15s,transform .1s}
.dot:hover{transform:scale(1.08)}
.d0,.d6{width:46px;height:46px}.d1,.d5{width:38px;height:38px}.d2,.d4{width:30px;height:30px}.d3{width:24px;height:24px}
.d0,.d1,.d2{border-color:var(--brand)}.d4,.d5,.d6{border-color:var(--sn)}.d3{border-color:var(--line-strong)}
.d0:hover,.d1:hover,.d2:hover,.d0[aria-checked="true"],.d1[aria-checked="true"],.d2[aria-checked="true"]{background:var(--brand)}
.d4:hover,.d5:hover,.d6:hover,.d4[aria-checked="true"],.d5[aria-checked="true"],.d6[aria-checked="true"]{background:var(--sn)}
.d3:hover,.d3[aria-checked="true"]{background:var(--muted)}
@media (max-width:480px){.lk-end{display:none}.lk-scale{gap:7px}.d0,.d6{width:40px;height:40px}.d1,.d5{width:34px;height:34px}.d2,.d4{width:28px;height:28px}.d3{width:22px;height:22px}
}
.lk-ctx{font:600 clamp(16px,2.1vw,18px)/1.5 var(--display);max-width:62ch;text-align:center;letter-spacing:-.01em}
.bp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;width:100%}
#app:has(.player){max-width:940px}
.bp .lk-scale{gap:10px}
.bp-opt{font-size:15px;line-height:1.45;padding:12px 14px;border-radius:12px;border:1px solid var(--line);transition:border-color .15s,background .15s}
.bp-opt.l{text-align:right;border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.bp-opt.r{border-color:color-mix(in srgb,var(--sn) 35%,var(--line))}
.bp-opt.l.on{background:var(--brand-soft);border-color:var(--brand)}
.bp-opt.r.on{background:color-mix(in srgb,var(--sn) 12%,var(--surface));border-color:var(--sn)}
@media (max-width:720px){.bp{grid-template-columns:1fr;gap:12px}.bp-opt.l{text-align:left}.lk-scale{justify-content:center}}
/* single-question player */
#app:has(.player){max-width:860px}
.track2{position:relative;height:10px;border-radius:5px;background:var(--brand-soft);margin:18px 6px 4px}
.fill2{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--brand),var(--lilac));transition:width .45s cubic-bezier(.2,.8,.2,1)}

  const order=["ISTJ","ISFJ","INFJ","INTJ","ISTP","ISFP","INFP","INTP","ESTP","ESFP","ENFP","ENTP","ESTJ","ESFJ","ENFJ","ENTJ"];
  const head=`<div class="hero stack" style="gap:18px"><div class="motif" aria-hidden="true"><i class="p"></i><i class="d"></i></div>
   <div class="stack" style="gap:6px"><span class="eyebrow">Admin · visible only to you</span><h2 style="color:var(--navy-fg)">Team results</h2></div>
   <div class="kpis"><div class="kpi"><b>${all.length}</b><span>completed</span></div><div class="kpi"><b>${Object.keys(counts).length}</b><span>different types</span></div><div class="kpi"><b>${rows.length?Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]:"–"}</b><span>most common</span></div></div></div>
  <div class="panel stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h3>Admin tools</h3><span class="row" style="gap:8px"><button class="btn ghost sm" id="impBtn">Import results</button><input type="file" id="impFile" accept=".json,application/json" multiple hidden><button class="btn ghost sm" id="expAll">Export all (JSON)</button><button class="btn ghost sm" id="refresh">Refresh</button><button class="btn sm" id="prev">Preview the test</button><button class="btn ghost sm" id="logout">Sign out</button></span></div>
   <p class="muted" style="font-size:15px">Results taken on this computer appear below. For results from other computers, ask people to send you their downloaded result file and use <strong>Import results</strong>. Use <strong>Preview the test</strong> to try it (nothing is saved) and the <strong>Questions</strong> tab to read every question. <strong>Reset</strong> lets someone retake it.</p></div>
  <div class="row" style="justify-content:space-between"><div class="subtabs">${[["people","People"],["map","Type map"],["questions","Questions"]].map(([k,l])=>`<button data-sub="${k}" aria-pressed="${S.sub===k}">${l}</button>`).join("")}</div>
   ${S.sub!=="questions"?`<div class="row"><select id="flt" style="width:auto" aria-label="Filter by company">${["All","SkillArbitrage","LawSikho","Both"].map(o=>`<option ${o===S.filter?"selected":""}>${o}</option>`).join("")}</select>${rows.length?`<button class="btn ghost sm" id="csv">Download CSV</button>`:""}</div>`:""}</div>`;
  if(S.sub==="questions")return `<div class="stack" style="gap:20px">${head}${questionsView()}</div>`;
  if(!rows.length)return `<div class="stack" style="gap:20px">${head}<div class="panel empty">No results yet. They appear here as soon as people submit.</div></div>`;
  if(S.sub==="map")return `<div class="stack" style="gap:20px">${head}<div class="stats">${Object.keys(DIMS).map(split).join("")}</div>
   <div class="typegrid">${order.map(t=>{const n=counts[t]||0,max=Math.max(...Object.values(counts));return `<div class="tg ${n?"has":"zero"}" style="${n?`background:color-mix(in srgb,var(--brand) ${Math.round(6+n/max*22)}%,var(--surface))`:""}"><span class="c">${t}</span><span class="n">${NAMES[t]}</span>${n?`<span class="k">${n}</span>`:""}</div>`}).join("")}</div>
   <p class="note">Each box is one of the 16 types. The darker the box, the more people with that type.</p></div>`;
  return `<div class="stack" style="gap:20px">${head}
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Position</th><th>Team</th><th>Type</th><th>E / I</th><th>N / S</th><th>T / F</th><th>J / P</th><th>Time</th><th>Taken</th>${S.isOwner?"<th></th>":""}</tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.org)}</td><td>${esc(r.pos)}</td><td>${esc(r.dept)}</td><td><span class="chip">${r.calc.type}</span> <span class="muted">${NAMES[r.calc.type]}</span>${r.calc.legacy?' <span class="muted" style="font-size:12px">(old version)</span>':""}</td>
   ${Object.keys(DIMS).map(k=>{const p=r.calc.pct[k],d=DIMS[k];return `<td>${p>=50?d.r+" "+p:d.l+" "+(100-p)}%</td>`}).join("")}
   <td>${r.secs!=null?Math.max(1,Math.round(r.secs/60))+" min":""}</td><td>${r.takenAt?new Date(r.takenAt).toLocaleDateString("en-IN",{day:"numeric",month:"short"}):""}</td>
   ${S.isOwner?`<td><button class="btn ghost sm rm" data-id="${esc(r._id)}">${S.confirm===r._id?"Confirm reset":"Reset"}</button></td>`:""}</tr>`).join("")}
  </tbody></table></div></div>`;
}
function questionsView(){
  return `<div class="tablewrap"><table class="qtable"><thead><tr><th>#</th><th>Situation</th><th>One end</th><th>Other end</th><th>Area</th></tr></thead><tbody>
  ${BANK.map((b,i)=>{const[d,pole]=KEYS[b[0]].split(":"),D=DIMS[d],other=pole===D.r?D.l:D.r;
   return `<tr><td>${i+1}</td><td>${esc(b[1])}</td><td>${esc(b[2])} <span class="mtag" style="background:var(${D.c})">${pole}</span></td><td>${esc(b[3])} <span class="mtag" style="background:var(${D.c})">${other}</span></td><td>${D.t}</td></tr>`}).join("")}
  </tbody></table></div><p class="note">Each person sees the 40 situations one at a time, in a different order, with the two options swapped at random.</p>`;
}
function bindTeam(){
  bindCsv();
  document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{S.sub=b.dataset.sub;render()});
  const fl=$("#flt");if(fl)fl.onchange=e=>{S.filter=e.target.value;render()};
  document.querySelectorAll(".rm").forEach(b=>b.onclick=async()=>{const id=b.dataset.id;if(S.confirm!==id){S.confirm=id;render();return}
    S.confirm=null;try{await S.sb.from("results").delete().eq("id",id)}catch(e){}await loadTeam()});
  $("#prev").onclick=startPreview;$("#refresh").onclick=loadTeam;bindImport();$("#logout").onclick=logout;
}
function startPreview(){{S.preview=true;S.saved={answers:S.answers,page:S.page,startedAt:S.startedAt,mode:S.mode,seenMile:S.seenMile};
    S.answers={};S.page=0;S.startedAt=null;S.seenMile={};S.mile=null;S.order=buildOrder(S.uid+"-preview-"+Date.now());S.mode="intro";S.tab="me";render();window.scrollTo(0,0)}}
function bindCsv(){
  const c=$("#csv");if(c)c.onclick=async()=>{
    const all=S.team.map(r=>({...r,calc:analyseRec(r)})),rows=S.filter==="All"?all:all.filter(r=>r.org===S.filter);
    const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
    const csv=[["Name","Email","Company","Position","Team","Type","Style","% Extroverted","% Intuition","% Thinking","% Judging","Minutes","Taken"].join(",")]
      .concat(rows.map(r=>[r.name,r.email,r.org,r.pos,r.dept,r.calc.type,NAMES[r.calc.type],r.calc.pct.EI,r.calc.pct.SN,r.calc.pct.FT,r.calc.pct.PJ,r.secs!=null?Math.round(r.secs/60):"",r.takenAt].map(q).join(","))).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="work-style-results.csv";document.body.appendChild(a);a.click();a.remove()};
}
function exitPreview(){try{localStorage.removeItem(dkey())}catch(e){}S.preview=false;Object.assign(S,S.saved||{});S.order=buildOrder(S.uid);S.prevRes=null;S.mile=null;S.tab=S.isEditor?"team":"me";render();window.scrollTo(0,0)}
$("#tabMe").onclick=()=>{S.tab="me";render()};$("#tabTeam").onclick=()=>{S.tab="team";render()};

render();
/* local storage backend: same interface the hosted version used, so every screen works offline */
const LSK="ws-local-results",ADM="ws-admin";
const lrows=()=>{try{return JSON.parse(localStorage.getItem(LSK)||"[]")}catch(e){return[]}};
const lsave=r=>{try{localStorage.setItem(LSK,JSON.stringify(r))}catch(e){}};
async function pwHash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ws:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"h"+hash("ws:"+s)}}
function addRows(list){const rows=lrows();let n=0,skip=0;
  list.forEach(r=>{if(!r||!r.name||!r.email||!r.type||!r.pct){skip++;return}
    const em=String(r.email).trim().toLowerCase();if(rows.some(x=>x.email===em)){skip++;return}
    rows.push({id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8),name:r.name,email:em,pos:r.pos||"",org:r.org||"",dept:r.dept||"",type:r.type,pct:r.pct,answers:r.answers||null,secs:r.secs??null,taken_at:r.takenAt||r.taken_at||new Date().toISOString(),v:r.v||5});n++});
  lsave(rows);return{n,skip}}
function localDb(){return{
  auth:{getSession:async()=>({data:{session:sessionStorage.getItem("ws-in")?{}:null}}),
   signInWithPassword:async({email,password})=>{let a=null;try{a=JSON.parse(localStorage.getItem(ADM)||"null")}catch(e){}
     const h=await pwHash(password),em=email.trim().toLowerCase();
     if(!a){if(!em||password.length<6)return{error:{message:"short"}};localStorage.setItem(ADM,JSON.stringify({em,h}));sessionStorage.setItem("ws-in","1");return{error:null}}
     if(a.em===em&&a.h===h){sessionStorage.setItem("ws-in","1");return{error:null}}return{error:{message:"bad"}}},
   signOut:async()=>{sessionStorage.removeItem("ws-in")}},
  rpc:async(n,a)=>({data:lrows().some(r=>r.email===String(a.p_email).trim().toLowerCase())}),
  from:()=>({
   insert:async r=>{const rows=lrows(),em=String(r.email).toLowerCase();if(rows.some(x=>x.email===em))return{error:{code:"23505"}};
     rows.push({id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8),...r,email:em});lsave(rows);return{error:null}},
   select:()=>({order:async()=>({data:lrows().sort((a,b)=>String(a.name).localeCompare(String(b.name)))})}),
   delete:()=>({eq:async(k,v)=>{lsave(lrows().filter(r=>r[k]!==v));return{}}})})}}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.addEventListener("click",e=>{if(e.target.id==="dlRes"&&S.mine)download("work-style-"+S.mine.name.replace(/[^\w]+/g,"-").toLowerCase()+".json",JSON.stringify(S.mine,null,1),"application/json")});
function bindImport(){
  $("#impBtn").onclick=()=>$("#impFile").click();
  $("#impFile").onchange=async e=>{let n=0,skip=0;
    for(const f of e.target.files){try{const j=JSON.parse(await f.text());const r=addRows(Array.isArray(j)?j:[j]);n+=r.n;skip+=r.skip}catch(err){skip++}}
    alert(n+" result(s) imported"+(skip?", "+skip+" skipped (duplicate email or not a result file).":"."));await loadTeam()};
  $("#expAll").onclick=()=>download("work-style-results-all.json",JSON.stringify(S.team.map(({_id,...r})=>r),null,1),"application/json");
}
function loginView(){return `<div class="panel stack" style="max-width:420px;margin:40px auto">
  <h2>Admin sign in</h2><p class="muted" style="font-size:14px">First time on this computer? Enter the email and password you want to use and they are remembered here. This lock keeps casual viewers out; it is not bank-grade security.</p><div class="field"><label for="ae">Email</label><input id="ae" type="email" autocomplete="username"></div>
  <div class="field"><label for="ap">Password</label><input id="ap" type="password" autocomplete="current-password"></div>
  <div class="row"><button class="btn" id="signin">Sign in</button><button class="btn ghost" id="cancelLogin">Back to the test</button></div><p class="err">${esc(S.err)}</p></div>`}
function bindLogin(){
  const go=async()=>{
    if(!S.sb){S.err="The database isn’t connected yet (see config.js).";render();return}
    const{error}=await S.sb.auth.signInWithPassword({email:$("#ae").value.trim(),password:$("#ap").value});
    if(error){S.err=S.pwSet?"Password must be at least 6 characters.":"Wrong email or password.";render();return}
    S.err="";history.replaceState(null,"",location.pathname);await enterAdmin();S.mode=S.mine?"result":"intro";render()};
  $("#signin").onclick=go;$("#ap").onkeydown=e=>{if(e.key==="Enter")go()};
  $("#cancelLogin").onclick=()=>{S.err="";S.mode=S.mine?"result":"intro";history.replaceState(null,"",location.pathname);render()};
  $("#ae").focus();
}
async function loadTeam(){
  if(!S.sb||!S.isEditor)return;
  const{data,error}=await S.sb.from("results").select("*").order("name");
  if(error){S.err="Couldn’t load results.";return}
  S.team=(data||[]).map(r=>({_id:r.id,name:r.name,email:r.email,org:r.org,dept:r.dept,pos:r.pos,type:r.type,pct:r.pct,answers:r.answers,secs:r.secs,takenAt:r.taken_at,v:r.v}));
  if(S.tab==="team"&&!S.preview)render();
}
async function enterAdmin(){S.isEditor=true;S.isOwner=true;S.tab="team";await loadTeam();clearInterval(S.poll);S.poll=setInterval(loadTeam,30000)}
async function logout(){try{await S.sb.auth.signOut()}catch(e){}clearInterval(S.poll);S.isEditor=false;S.isOwner=false;S.team=[];S.tab="me";S.mode=S.mine?"result":"intro";render()}
document.addEventListener("click",e=>{if(e.target.id==="adminLink"){e.preventDefault();S.mode="login";S.err="";render()}});
(async()=>{
  const cfg=window.QUIZ_CONFIG||{};
  S.local=true;
  try{S.uid=localStorage.getItem("ws-id")||("local-"+Math.random().toString(36).slice(2));localStorage.setItem("ws-id",S.uid)}catch(e){S.uid="local-"+Math.random().toString(36).slice(2)}
  S.sb=localDb();
  S.order=buildOrder(S.uid);loadDraft();
  try{const m=JSON.parse(localStorage.getItem("ws-result")||"null");if(m){S.mine=m;S.mode="result"}}catch(e){}
  if(S.mode!=="result")S.mode=Object.keys(S.answers).length?"quiz":"intro";
  if(S.sb){try{const{data}=await S.sb.auth.getSession();if(data.session)await enterAdmin()}catch(e){}}
  if(location.hash==="#admin"&&!S.isEditor)S.mode="login";
  render();
})();
</script>

</body>
